<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin: 20px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .scores {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
        }
        .score {
            font-size: 1.2em;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            width: 300px;
            height: 300px;
            max-width: 90vw;
            max-height: 90vw;
        }
        .cell {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            font-size: 2em;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cell:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .cell.taken {
            cursor: not-allowed;
        }
        .cell.x::before {
            content: 'X';
        }
        .cell.o::before {
            content: 'O';
        }
        .turn {
            font-size: 1.5em;
            margin: 20px 0;
        }
        .reset {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        .reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .winner {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .footer {
            text-align: center;
            font-size: 0.8em;
            opacity: 0.7;
            padding: 10px;
            margin-top: auto;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            .scores {
                flex-direction: column;
                gap: 10px;
            }
            .board {
                width: 250px;
                height: 250px;
            }
            .cell {
                font-size: 1.5em;
            }
            .turn {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="scores">
            <div class="score">Player X: <span id="scoreX">0</span></div>
            <div class="score">Player O: <span id="scoreO">0</span></div>
        </div>
        <div class="turn">Player X's turn</div>
        <div class="board" id="board">
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
        </div>
        <button class="reset" id="reset">Reset Game</button>
    </div>
    <div class="footer">
        &copy; 2025 muneeb fayaz. All rights reserved.
    </div>
    <script>
        const board = document.getElementById('board');
        const cells = document.querySelectorAll('[data-cell]');
        const turnDisplay = document.querySelector('.turn');
        const resetButton = document.getElementById('reset');
        const scoreX = document.getElementById('scoreX');
        const scoreO = document.getElementById('scoreO');

        let currentPlayer = 'X';
        let gameActive = true;
        let scores = { X: 0, O: 0 };

        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleClick(e) {
            const cell = e.target;
            if (!gameActive || cell.classList.contains('taken')) return;

            cell.classList.add('taken', currentPlayer.toLowerCase());
            if (checkWin()) {
                scores[currentPlayer]++;
                updateScores();
                turnDisplay.textContent = `Player ${currentPlayer} wins!`;
                gameActive = false;
                highlightWinner();
                return;
            }
            if (checkDraw()) {
                turnDisplay.textContent = "It's a draw!";
                gameActive = false;
                return;
            }
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            turnDisplay.textContent = `Player ${currentPlayer}'s turn`;
        }

        function checkWin() {
            return winningCombinations.some(combination => {
                return combination.every(index => {
                    return cells[index].classList.contains(currentPlayer.toLowerCase());
                });
            });
        }

        function checkDraw() {
            return [...cells].every(cell => cell.classList.contains('taken'));
        }

        function highlightWinner() {
            winningCombinations.forEach(combination => {
                if (combination.every(index => cells[index].classList.contains(currentPlayer.toLowerCase()))) {
                    combination.forEach(index => {
                        cells[index].classList.add('winner');
                    });
                }
            });
        }

        function updateScores() {
            scoreX.textContent = scores.X;
            scoreO.textContent = scores.O;
        }

        function resetGame() {
            cells.forEach(cell => {
                cell.classList.remove('taken', 'x', 'o', 'winner');
            });
            currentPlayer = 'X';
            gameActive = true;
            turnDisplay.textContent = `Player ${currentPlayer}'s turn`;
        }

        cells.forEach(cell => cell.addEventListener('click', handleClick));
        resetButton.addEventListener('click', resetGame);
    </script>
</body>
</html>
